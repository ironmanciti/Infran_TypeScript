<!DOCTYPE html>
<html>
  <head>
    <title>DOM Basics</title>
    <meta charset="UTF-8" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="flex flex-col items-center py-20 bg-neutral-800">
    <form class="flex flex-col items-center gap-4">
      <input
        id="1"
        type="number"
        placeholder="0"
        class="w-full rounded-md bg-neutral-900 py-3 px-6 text-base font-medium text-[#6B7280] outline-none focus:shadow-md" />

      <input
        id="2"
        type="number"
        placeholder="0"
        class="w-full rounded-md bg-neutral-900 py-3 px-6 text-base font-medium text-[#6B7280] outline-none focus:shadow-md" />

      <input
        id="3"
        type="number"
        placeholder="0"
        class="w-full rounded-md bg-neutral-900 py-3 px-6 text-base font-medium text-[#6B7280] outline-none focus:shadow-md" />

      <input
        id="4"
        type="number"
        placeholder="0"
        class="w-full rounded-md bg-neutral-900 py-3 px-6 text-base font-medium text-[#6B7280] outline-none focus:shadow-md" />

      <button
        class="flex p-2.5 bg-blue-500 rounded-xl hover:rounded-3xl hover:bg-blue-600 transition-all duration-300 text-white"
        type="submit">
        Submit
      </button>
    </form>

    <div class="flex flex-col">
      <p id="message" class="m-4 text-neutral-300 font-bold">Input all of the numbers</p>

      <p id="max" class="m-4 text-neutral-200 text-center font-bold"></p>

      <p id="min" class="m-4 text-neutral-200 text-center font-bold"></p>
    </div>
    <script>
        const form = document.querySelector("form");
        const button = document.querySelector("button");
        const allInputs = document.querySelectorAll("input");
        const message = document.querySelector("#message");
        const max = document.querySelector("#max");
        const min = document.querySelector("#min");

        form.onsubmit = (event) => {
            event.preventDefault();

            const numbers = [...allInputs].map((input) => input.valueAsNumber);
            console.log(numbers);
        }

        const maxNumber = Math.max(...numbers);
        const minNumber = Math.min(...numbers);
        
        message.textContent = numbers.join(", ");

    </script>
  </body>
</html>
